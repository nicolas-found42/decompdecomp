name: PR 2 Windows timing diagnostic
on:
  push:
    branches: [ci/pr-2-validation]
permissions:
  contents: read
jobs:
  timing:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 95a3e266d97fe84a6593b668aa094dfc9373422c
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Retry the unchanged one-match save regression on Windows
        shell: pwsh
        run: |
          $failed = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Run $attempt of 3"
            uv run pytest -q tests/test_progress_speed.py::test_one_match_changed_writes_its_file_and_the_manifest
            if ($LASTEXITCODE -ne 0) { $failed++ }
          }
          exit $failed
